<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🔐 Password Decrypt Tool</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0f1117; color: #e8eaf0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    padding: 24px 16px 48px; min-height: 100vh;
  }
  h2 { font-family: monospace; font-size: 20px; color: #00d4aa; margin-bottom: 4px; }
  .sub { font-size: 13px; color: #6b7280; margin-bottom: 28px; }
  label { font-size: 13px; color: #9ca3af; font-weight: 500; display: block; margin-bottom: 6px; }
  input, textarea {
    width: 100%; background: #1a1d26; border: 1px solid #2a2d3a;
    border-radius: 10px; padding: 12px 14px; color: #e8eaf0;
    font-family: monospace; font-size: 14px; outline: none;
    transition: border .2s; resize: none;
  }
  input:focus, textarea:focus { border-color: #00d4aa; }
  .field { margin-bottom: 16px; }
  .btn {
    width: 100%; padding: 14px; border-radius: 10px; border: none;
    font-size: 15px; font-weight: 600; cursor: pointer;
    font-family: inherit; transition: all .15s; margin-bottom: 8px;
  }
  .enc { background: #00d4aa; color: #000; }
  .dec { background: #0099ff; color: #000; }
  .result {
    margin-top: 16px; background: #1a1d26;
    border: 1px solid #2a2d3a; border-radius: 10px;
    padding: 16px; display: none;
  }
  .result-label {
    font-size: 11px; color: #6b7280; font-weight: 600;
    text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px;
  }
  .result-text {
    font-family: monospace; font-size: 14px;
    word-break: break-all; line-height: 1.7;
  }
  .enc-color { color: #00d4aa; }
  .dec-color { color: #0099ff; }
  .copy-btn {
    margin-top: 12px; background: #2a2d3a; border: 1px solid #3a3d4a;
    border-radius: 8px; padding: 8px 16px; font-size: 13px;
    color: #9ca3af; cursor: pointer; font-family: inherit;
    transition: all .15s; width: 100%;
  }
  .copy-btn:active { background: #3a3d4a; color: #00d4aa; }
  .err { color: #ff4757; font-size: 13px; margin-top: 10px; display: none; }
  .input-with-btn { display: flex; gap: 8px; align-items: center; }
  .input-with-btn input { flex: 1; }
  .gen-btn {
    background: #7c3aed; color: #fff; border: none; border-radius: 10px;
    padding: 12px 14px; font-size: 12px; font-weight: 600; cursor: pointer;
    white-space: nowrap; font-family: inherit; transition: all .15s; flex-shrink: 0;
  }
  .gen-btn:active { background: #6d28d9; }
  hr { border: none; border-top: 1px solid #2a2d3a; margin: 28px 0; }
  .section-title {
    font-size: 13px; font-weight: 600; color: #6b7280;
    text-transform: uppercase; letter-spacing: 1px; margin-bottom: 16px;
  }
</style>
</head>
<body>
 
<h2>🔐 VaultX</h2>
 
<!-- ENCRYPT -->
<div class="section-title">🔒 Encrypt</div>
<div class="field">
  <label>Master Password</label>
  <input type="password" id="enc-master" placeholder="master password dalo...">
</div>
<div class="field">
  <label>Original Password</label>
  <div class="input-with-btn">
    <input type="text" id="enc-plain" placeholder="e.g. MyGmail@123" autocomplete="off">
    <button class="gen-btn" onclick="generatePassword()">⚡ Generate</button>
  </div>
</div>
<button class="btn enc" onclick="doEncrypt()">🔒 Encrypt</button>
<div class="result" id="enc-result">
  <div class="result-label">Encrypted Password — copy karke file me save karo</div>
  <div class="result-text enc-color" id="enc-output"></div>
  <button class="copy-btn" onclick="copyText('enc-output', this)">📋 Copy</button>
</div>
<div class="err" id="enc-err"></div>
 
<hr>
 
<!-- DECRYPT -->
<div class="section-title">🔓 Decrypt</div>
<div class="field">
  <label>Master Password</label>
  <input type="password" id="dec-master" placeholder="master password dalo...">
</div>
<div class="field">
  <label>Encrypted Password</label>
  <textarea id="dec-cipher" rows="4" placeholder="encrypted text yahan paste karo..."></textarea>
</div>
<button class="btn dec" onclick="doDecrypt()">🔓 Decrypt</button>
<div class="result" id="dec-result">
  <div class="result-label">Original Password</div>
  <div class="result-text dec-color" id="dec-output"></div>
  <button class="copy-btn" onclick="copyText('dec-output', this)">📋 Copy</button>
</div>
<div class="err" id="dec-err"></div>
 
<script>
function generatePassword() {
  const upper = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
  const lower = 'abcdefghijklmnopqrstuvwxyz';
  const nums  = '0123456789';
  const spec  = '!@#$%^&*()_+-=[]{}?';
  const all   = upper + lower + nums + spec;
  let pwd = [
    upper[Math.floor(Math.random() * upper.length)],
    upper[Math.floor(Math.random() * upper.length)],
    lower[Math.floor(Math.random() * lower.length)],
    lower[Math.floor(Math.random() * lower.length)],
    nums[Math.floor(Math.random() * nums.length)],
    nums[Math.floor(Math.random() * nums.length)],
    spec[Math.floor(Math.random() * spec.length)],
    spec[Math.floor(Math.random() * spec.length)],
  ];
  for (let i = 8; i < 11; i++) pwd.push(all[Math.floor(Math.random() * all.length)]);
  pwd = pwd.sort(() => Math.random() - 0.5).join('');
  document.getElementById('enc-plain').value = pwd;
}
 
, td = new TextDecoder();
 
async function getKey(pwd, salt) {
  const km = await crypto.subtle.importKey('raw', te.encode(pwd), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt, iterations: 200000, hash: 'SHA-256' },
    km, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']
  );
}
 
async function doEncrypt() {
  const pwd = document.getElementById('enc-master').value;
  const txt = document.getElementById('enc-plain').value;
  const err = document.getElementById('enc-err');
  err.style.display = 'none';
  if (!pwd || !txt) { err.textContent = '⚠️ Dono fields bharni hain!'; err.style.display = 'block'; return; }
  const salt = crypto.getRandomValues(new Uint8Array(16));
  const iv   = crypto.getRandomValues(new Uint8Array(12));
  const key  = await getKey(pwd, salt);
  const ct   = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, te.encode(txt));
  const out  = new Uint8Array(salt.length + iv.length + ct.byteLength);
  out.set(salt, 0); out.set(iv, 16); out.set(new Uint8Array(ct), 28);
  document.getElementById('enc-output').textContent = btoa(String.fromCharCode(...out));
  document.getElementById('enc-result').style.display = 'block';
}
 
async function doDecrypt() {
  const pwd = document.getElementById('dec-master').value;
  const b64 = document.getElementById('dec-cipher').value.trim();
  const err = document.getElementById('dec-err');
  err.style.display = 'none';
  if (!pwd || !b64) { err.textContent = '⚠️ Dono fields bharni hain!'; err.style.display = 'block'; return; }
  try {
    const buf = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
    const key = await getKey(pwd, buf.slice(0, 16));
    const pt  = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: buf.slice(16, 28) }, key, buf.slice(28));
    document.getElementById('dec-output').textContent = td.decode(pt);
    document.getElementById('dec-result').style.display = 'block';
  } catch {
    err.textContent = '❌ Wrong master password ya invalid encrypted text!';
    err.style.display = 'block';
    document.getElementById('dec-result').style.display = 'none';
  }
}
 
async function copyText(id, btn) {
  const t = document.getElementById(id).textContent;
  await navigator.clipboard.writeText(t);
  btn.textContent = '✅ Copied!';
  setTimeout(() => btn.textContent = '📋 Copy', 2000);
}
</script>
 
</body>
</html>
